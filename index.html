<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LALO | Artist Site</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">

    <style>
        /* 1. RESET & BASE */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            height: 100%;
            width: 100%;
            background-color: #000; /* Dark background */
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden; /* We handle scrolling in the containers below */
        }

        /* 2. THE MAIN VERTICAL SCROLLER */
        #v-scroller {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }
        #v-scroller::-webkit-scrollbar { display: none; }

        .v-section {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 3. THE HORIZONTAL SCROLLER (Inside first section) */
        #h-scroller {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
        }
        #h-scroller::-webkit-scrollbar { display: none; }

        .h-slide {
            flex: 0 0 100vw;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 4. CONTENT STYLING */
        .release-box {
            transition: all 0.6s ease-out;
            filter: blur(20px);
            opacity: 0.2;
            transform: scale(0.8);
        }

        /* This class is added by JavaScript when the item is centered */
        .release-box.active {
            filter: blur(0px);
            opacity: 1;
            transform: scale(1);
        }

        .cover-art {
            width: 75vw;
            max-width: 400px;
            aspect-ratio: 1/1;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            background: #111; /* Placeholder color if image fails */
        }

        /* 5. UI ELEMENTS (Pills, Audio, Socials) */
        .blue-pill {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            background: rgba(0, 100, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #4da3ff;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            z-index: 100;
        }

        .audio-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            z-index: 100;
            font-size: 10px;
        }

        /* 6. GLITCH TEXT */
        .glitch {
            font-size: 3rem;
            letter-spacing: 10px;
            position: relative;
        }

        /* 7. MODAL */
        #social-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(30px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <div class="audio-btn" onclick="playMusic()">SOUND: <span id="st">OFF</span></div>
    <div class="blue-pill" onclick="openSocials()">SOCIALS</div>

    <div id="social-modal">
        <h1>CONNECT</h1>
        <p onclick="window.open('https://instagram.com')">INSTAGRAM</p>
        <p onclick="window.open('https://tiktok.com')">TIKTOK</p>
        <p onclick="openSocials()" style="margin-top:40px; opacity:0.5; cursor:pointer;">BACK</p>
    </div>

    <audio id="player" loop><source src="your-song.mp3" type="audio/mpeg"></audio>

    <main id="v-scroller">
        
        <section class="v-section">
            <div id="h-scroller">
                <div class="h-slide">
                    <div class="release-box">
                        <h1 class="glitch">MERCH</h1>
                        <p>COMING SOON</p>
                    </div>
                </div>
                <div class="h-slide">
                    <div class="release-box active">
                        <img src="https://via.placeholder.com/400" class="cover-art">
                        <h2 style="margin-top:20px;">LATEST TRACK</h2>
                    </div>
                </div>
                <div class="h-slide">
                    <div class="release-box">
                        <h1 class="glitch">TOUR</h1>
                        <p>MARCH 2026</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="v-section">
            <div class="release-box">
                <img src="https://via.placeholder.com/400" class="cover-art">
                <h2 style="margin-top:20px;">PREVIOUS SONG</h2>
            </div>
        </section>

    </main>

    <script>
        const v = document.getElementById('v-scroller');
        const h = document.getElementById('h-scroller');

        // 1. CENTER THE HUB ON START
        window.addEventListener('load', () => {
            h.scrollLeft = window.innerWidth;
        });

        // 2. KEYBOARD ARROWS
        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") h.scrollBy({ left: window.innerWidth, behavior: 'smooth' });
            if (e.key === "ArrowLeft") h.scrollBy({ left: -window.innerWidth, behavior: 'smooth' });
            if (e.key === "ArrowDown") v.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
            if (e.key === "ArrowUp") v.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
        });

        // 3. UI FUNCTIONS
        function openSocials() {
            const m = document.getElementById('social-modal');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        function playMusic() {
            const a = document.getElementById('player');
            const s = document.getElementById('st');
            if (a.paused) { a.play(); s.innerText = "ON"; }
            else { a.pause(); s.innerText = "OFF"; }
        }

        // 4. FOCUS / BLUR OBSERVER
        const obs = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const box = entry.target.querySelector('.release-box');
                if (entry.isIntersecting) box.classList.add('active');
                else box.classList.remove('active');
            });
        }, { threshold: 0.5 });

        // Watch every section and slide
        document.querySelectorAll('.v-section, .h-slide').forEach(item => obs.observe(item));
    </script>
</body>
</html>

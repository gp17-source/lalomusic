<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LALO | Artist Site</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">

    <style>
        /* 1. RESET & BASE */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            height: 100%; width: 100%;
            background-color: #000; color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
        }

        /* 2. SCROLLERS */
        #v-scroller { height: 100vh; width: 100vw; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
        #v-scroller::-webkit-scrollbar { display: none; }
        .v-section { height: 100vh; width: 100vw; scroll-snap-align: start; display: flex; justify-content: center; align-items: center; position: relative; }
        #h-scroller { display: flex; height: 100vh; width: 100vw; overflow-x: scroll; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
        #h-scroller::-webkit-scrollbar { display: none; }
        .h-slide { flex: 0 0 100vw; height: 100vh; scroll-snap-align: start; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }

        /* 3. CONTENT & PILLS */
        .release-box { transition: all 0.6s ease-out; filter: blur(20px); opacity: 0.2; transform: scale(0.8); }
        .release-box.active { filter: blur(0px); opacity: 1; transform: scale(1); }
        .cover-art { width: 75vw; max-width: 400px; aspect-ratio: 1/1; border-radius: 15px; box-shadow: 0 0 50px rgba(0,0,0,0.5); background: #111; }

        .blue-pill {
            position: fixed; left: 50%; transform: translateX(-50%);
            padding: 15px 40px; background: rgba(0, 102, 255, 0.2);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
            color: #4da3ff; font-weight: bold; letter-spacing: 2px;
            cursor: pointer; z-index: 100; transition: 0.5s;
        }
        #social-pill { bottom: 30px; }
        #disco-pill { bottom: 100px; opacity: 0; visibility: hidden; }

        .audio-btn { position: fixed; top: 25px; right: 25px; background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 20px; backdrop-filter: blur(10px); cursor: pointer; z-index: 100; font-size: 10px; }
        .glitch { font-size: 3rem; letter-spacing: 10px; position: relative; }

        /* 4. MODALS */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); backdrop-filter: blur(30px);
            z-index: 1000; justify-content: flex-start; align-items: center;
            flex-direction: column; overflow-y: auto; padding: 60px 0;
        }

        .section-header { font-size: 0.8rem; letter-spacing: 4px; opacity: 0.5; margin: 40px 0 20px 0; text-transform: uppercase; }
        .disco-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 90%; max-width: 800px; padding: 10px; }
        @media (min-width: 768px) { .disco-grid { grid-template-columns: repeat(4, 1fr); } }

        .disco-item { text-align: center; cursor: pointer; transition: 0.3s; pointer-events: auto; }
        .disco-item:hover { transform: scale(1.05); }
        .disco-item img { width: 100%; border-radius: 10px; margin-bottom: 10px; pointer-events: none; }
        
        .project-glow img { box-shadow: 0 0 25px rgba(77, 163, 255, 0.4); border: 1px solid rgba(77, 163, 255, 0.3); }

        /* 5. SONG DETAIL VIEW (HIGHEST Z-INDEX) */
        #detail-view {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 5000; padding: 20px;
            justify-content: center; align-items: center;
            overflow-y: auto;
        }

        .detail-content {
            display: flex; flex-direction: column; max-width: 900px; width: 100%; gap: 40px; padding: 40px 0;
        }

        @media (min-width: 768px) {
            .detail-content { flex-direction: row; align-items: center; padding: 0; }
        }

        .detail-img { width: 100%; max-width: 400px; aspect-ratio: 1/1; border-radius: 20px; box-shadow: 0 20px 80px rgba(0,0,0,0.8); object-fit: cover; }
        .detail-info { flex: 1; text-align: left; }
        .detail-info h1 { font-size: 2.5rem; margin-bottom: 20px; letter-spacing: 2px; }
        .detail-info p { line-height: 1.6; opacity: 0.7; margin-bottom: 30px; font-weight: 300; font-size: 0.95rem; }

        .listen-btn {
            display: inline-block; padding: 15px 45px; background: #4da3ff; color: #000;
            text-decoration: none; font-weight: 700; border-radius: 50px; letter-spacing: 2px;
            transition: 0.3s; text-align: center;
        }
        .listen-btn:hover { background: #fff; transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="audio-btn" onclick="playMusic()">SOUND: <span id="st">OFF</span></div>
    
    <div id="disco-pill" class="blue-pill" onclick="toggleModal('disco-modal')">DISCOGRAPHY</div>
    <div id="social-pill" class="blue-pill" onclick="toggleModal('social-modal')">SOCIALS</div>

    <div id="social-modal" class="modal" style="justify-content: center;">
        <h1>CONNECT</h1>
        <p onclick="window.open('https://instagram.com')" style="cursor:pointer; margin: 10px;">INSTAGRAM</p>
        <p onclick="window.open('https://tiktok.com')" style="cursor:pointer; margin: 10px;">TIKTOK</p>
        <p onclick="toggleModal('social-modal')" style="margin-top:40px; opacity:0.5; cursor:pointer;">BACK</p>
    </div>

    <div id="disco-modal" class="modal">
        <h1 style="letter-spacing: 5px;">CATALOG</h1>

        <h2 class="section-header">Projects</h2>
        <div class="disco-grid">
            <div class="disco-item project-glow" onclick="showDetail('ALBUM NAME', 'https://via.placeholder.com/400', 'This is the story of your album. Talk about the production process, the inspiration, or the SJSU roots behind the tracks.', '#')">
                <img src="https://via.placeholder.com/200">
                <p>ALBUM NAME</p>
            </div>
        </div>

        <h2 class="section-header">Singles</h2>
        <div class="disco-grid">
            <div class="disco-item" onclick="showDetail('SINGLE TITLE', 'https://via.placeholder.com/400', 'The backstory for this specific track goes here. Keep it brief and aesthetic.', '#')">
                <img src="https://via.placeholder.com/200">
                <p>SINGLE 1</p>
            </div>
        </div>

        <p onclick="toggleModal('disco-modal')" style="margin-top:60px; padding-bottom: 40px; opacity:0.5; cursor:pointer;">BACK</p>
    </div>

    <div id="detail-view">
        <div class="detail-content">
            <img id="detail-image" src="" class="detail-img">
            <div class="detail-info">
                <h1 id="detail-title">TITLE</h1>
                <p id="detail-text">Story text...</p>
                <a id="detail-link" href="#" target="_blank" class="listen-btn">LISTEN</a>
                <p onclick="hideDetail()" style="margin-top:40px; opacity:0.4; cursor:pointer; font-size: 12px; letter-spacing: 2px;">CLOSE STORY</p>
            </div>
        </div>
    </div>

    <audio id="player" loop><source src="your-song.mp3" type="audio/mpeg"></audio>

    <main id="v-scroller">
        <section class="v-section" data-section="hub">
            <div id="h-scroller">
                <div class="h-slide">
                    <div class="release-box"><h1 class="glitch">MERCH</h1><p>COMING SOON</p></div>
                </div>
                <div class="h-slide">
                    <div class="release-box active">
                        <img src="https://via.placeholder.com/400" class="cover-art">
                        <h2 style="margin-top:20px;">LATEST TRACK</h2>
                    </div>
                </div>
                <div class="h-slide">
                    <div class="release-box"><h1 class="glitch">TOUR</h1><p>COMING SOON</p></div>
                </div>
            </div>
        </section>

        <section class="v-section" data-section="previous">
            <div class="release-box">
                <img src="https://via.placeholder.com/400" class="cover-art">
                <h2 style="margin-top:20px;">PREVIOUS SONG</h2>
            </div>
        </section>
    </main>

    <script>
        const v = document.getElementById('v-scroller');
        const h = document.getElementById('h-scroller');
        const discoPill = document.getElementById('disco-pill');

        window.addEventListener('load', () => { h.scrollLeft = window.innerWidth; });

        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") h.scrollBy({ left: window.innerWidth, behavior: 'smooth' });
            if (e.key === "ArrowLeft") h.scrollBy({ left: -window.innerWidth, behavior: 'smooth' });
            if (e.key === "ArrowDown") v.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
            if (e.key === "ArrowUp") v.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
        });

        function toggleModal(id) {
            const m = document.getElementById(id);
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        // IMPROVED SHOW DETAIL LOGIC
        function showDetail(title, img, bio, link) {
            document.getElementById('detail-title').innerText = title;
            document.getElementById('detail-image').src = img;
            document.getElementById('detail-text').innerText = bio;
            document.getElementById('detail-link').href = link;
            
            const detailView = document.getElementById('detail-view');
            detailView.style.display = 'flex';
            detailView.scrollTop = 0; // Ensure it starts at the top
        }

        function hideDetail() {
            document.getElementById('detail-view').style.display = 'none';
        }

        function playMusic() {
            const a = document.getElementById('player');
            const s = document.getElementById('st');
            if (a.paused) { a.play(); s.innerText = "ON"; }
            else { a.pause(); s.innerText = "OFF"; }
        }

        const obs = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const box = entry.target.querySelector('.release-box');
                if (entry.isIntersecting) {
                    box.classList.add('active');
                    if (entry.target.dataset.section === "previous") {
                        discoPill.style.opacity = "1"; discoPill.style.visibility = "visible";
                    } else {
                        discoPill.style.opacity = "0"; discoPill.style.visibility = "hidden";
                    }
                } else { box.classList.remove('active'); }
            });
        }, { threshold: 0.5 });

        document.querySelectorAll('.v-section, .h-slide').forEach(item => obs.observe(item));
    </script>
</body>
</html>
